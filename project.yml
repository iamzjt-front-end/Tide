name: Tide
options:
  bundleIdPrefix: com.iamzjt
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CODE_SIGN_STYLE: Automatic
targets:
  Tide:
    type: application
    platform: macOS
    sources:
      - path: Tide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamzjt.Tide
        PRODUCT_NAME: Tide
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tide
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - TideTests
  TideTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TideTests
    dependencies:
      - target: Tide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamzjt.TideTests
        GENERATE_INFOPLIST_FILE: YES

name: Tide
options:
  bundleIdPrefix: com.iamzjt
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: S4V6N8R7NP
targets:
  Tide:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Tide
        excludes:
          - Info.plist
          - AppIcon.icon
          - Resources/TideAppIcon.icns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamzjt.Tide
        PRODUCT_NAME: Tide
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Tide/Info.plist
        MARKETING_VERSION: 0.0.4
        CURRENT_PROJECT_VERSION: 18
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets:
        - TideTests
  TideTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TideTests
    dependencies:
      - target: Tide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamzjt.TideTests
        GENERATE_INFOPLIST_FILE: YES
